<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les 10 ans de la Biocoop de Gourdon – Calendrier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FEFEFF; --navy:#00305A; --green:#7BAA17; --sun:#F8B000; --paper:#FFFFFF; --ink:#00305A; --muted:#4A6178; --line:#C5D0DB;
  color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:32px 20px 56px}
header{margin-bottom:28px;text-align:center}
.logo{display:block;width:min(360px,80%);height:auto;margin:0 auto 12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header p{margin:0 auto;color:var(--muted);max-width:52ch;font-size:1.05rem}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:24px 0 20px;padding-top:16px;border-top:3px solid var(--green)}
.count{font-weight:600}
.toggle{display:flex;gap:8px;align-items:center;font-size:.95rem;color:var(--muted);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;list-style:none;margin:0;padding:0}
.tile{perspective:900px}
.card{position:relative;display:block;width:100%;aspect-ratio:1/1.2;border:0;padding:0;background:none;font:inherit;color:inherit;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.card:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:18px}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px;display:flex;flex-direction:column}
.front{align-items:flex-start;justify-content:space-between;text-align:left}
.front .mon{font-size:1.7rem;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.front .yr{font-weight:400;opacity:.85;font-size:1rem;display:block;margin-top:2px}
.front .hint{font-size:.9rem;font-weight:600}
.c0 .front{background:var(--navy);color:#fff}
.c1 .front{background:var(--green);color:var(--navy)}
.c2 .front{background:var(--sun);color:var(--navy)}
.tile.locked .front{background:transparent;border:2px dashed var(--line);color:var(--muted)}
.tile.locked .card{cursor:not-allowed}
.back{transform:rotateY(180deg);background:var(--paper);border:3px solid var(--navy);overflow:auto;gap:6px}
.back .ico{font-size:1.9rem;line-height:1}
.back h2{font-size:1.1rem;line-height:1.2;margin:4px 0 0;font-weight:800;color:var(--navy)}
.back p{margin:0;font-size:.9rem;color:var(--muted)}
.back .when{font-weight:600;color:var(--navy)}
.front{border:0;font:inherit;width:100%;height:100%;cursor:pointer}
.tile.locked .front{cursor:not-allowed}
.face:focus-visible,.back a:focus-visible,.close:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.links{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.links a{color:var(--navy);font-weight:600;font-size:.9rem;text-underline-offset:3px}
.close{position:absolute;top:8px;right:8px;width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--navy);color:#fff;font:inherit;font-size:1rem;line-height:1;cursor:pointer;padding:0}.close:hover{background:var(--green);color:var(--navy)}
.tile.open .card{transform:rotateY(180deg)}
.tile.shake .card{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
footer{margin-top:28px;color:var(--muted);font-size:.9rem;text-align:center}
@media (prefers-reduced-motion:reduce){.card{transition:none}.tile.shake .card{animation:none}}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.front .mon{font-size:1.35rem}.back h2{font-size:1rem}}

header.hero{position:relative;overflow:hidden;border-radius:24px;background:#fff;border:3px solid var(--navy);padding:64px 20px 26px;margin-bottom:28px;text-align:center;box-shadow:0 8px 0 var(--sun)}
.bunting{position:absolute;z-index:2;top:0;left:-12px;right:-12px;height:46px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='46'><path d='M0 4H150' stroke='%2300305A' stroke-width='3'/><polygon points='9,4 41,4 25,36' fill='%2300305A'/><polygon points='59,4 91,4 75,36' fill='%237BAA17'/><polygon points='109,4 141,4 125,36' fill='%23F8B000'/></svg>") repeat-x;background-size:150px 46px;transform-origin:50% 0;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.logos{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,40px);flex-wrap:wrap}
.logo-store{width:clamp(96px,18vw,132px);height:auto;filter:drop-shadow(0 6px 10px rgba(0,48,90,.3));animation:wobble 5s ease-in-out infinite}
.logo-10{width:min(400px,76vw);height:auto;mix-blend-mode:multiply;animation:pop 3.2s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes pop{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.04) rotate(1deg)}}
.confetti{position:absolute;inset:0;z-index:0;pointer-events:none}
.confetti span{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(620px) rotate(600deg)}}
header.hero p{position:relative;z-index:1;margin:14px auto 0}
@media (prefers-reduced-motion:reduce){.bunting,.logo-store,.logo-10{animation:none}.confetti{display:none}}
</style>
</head>

  if(ev.month){m=ev.month-1;y=ev.year||(m<CONFIG.startMonth-1?CONFIG.startYear+1:CONFIG.startYear)}
  else{m=(prev+1)%12;y=prevYear+(prev+1>=12?1:0);if(ev.year)y=ev.year}
  prev=m;prevYear=y;
  let opens=new Date(y,m,1);
  if(ev.opens){const[a,b,c]=ev.opens.split("-").map(Number);opens=new Date(a,b-1,c)}
  return{ev,m,y,opens,id:y+"-"+m};
});
if(CONFIG.sortByDate)slots.sort((a,b)=>new Date(a.y,a.m,1)-new Date(b.y,b.m,1)||a.opens-b.opens);

const first=slots[0],last=slots[slots.length-1];
document.getElementById("intro").textContent="Une surprise s’ouvre chaque mois, de "+MONTHS[first.m]+" "+first.y+" à "+MONTHS[last.m]+" "+last.y+". Touchez la case du mois pour découvrir l’événement.";

const isUnlocked=s=>previewEl.checked||s.opens<=new Date();
const fmtDate=d=>(d.getDate()===1?"1er":d.getDate())+" "+MONTHS[d.getMonth()];
function setOpen(li,s,open){
  li.classList.toggle("open",open);
  li.querySelector(".front").inert=open;
  li.querySelector(".back").inert=!open;
  if(open)opened.add(s.id);else opened.delete(s.id);
  save();
}
function render(){
  grid.innerHTML="";
  slots.forEach((s,i)=>{
    const li=document.createElement("li"),unlocked=isUnlocked(s),isOpen=opened.has(s.id)&&unlocked,ev=s.ev;
    li.className="tile c"+(i%3)+(unlocked?"":" locked");
    const label=cap(MONTHS[s.m]);
    const links=(ev.links||[]).filter(l=>l&&l.url).map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+esc(l.label||l.url)+' ↗</a>').join("");
    li.innerHTML='<div class="card">'+
      '<button type="button" class="face front" aria-label="'+label+' '+s.y+' : '+(unlocked?"ouvrir la case":"ouverture le "+fmtDate(s.opens))+'">'+
        '<span class="mon">'+label+'<span class="yr">'+s.y+'</span></span>'+
        '<span class="hint">'+(unlocked?"Ouvrir la case":"Ouvre le "+fmtDate(s.opens))+'</span></button>'+
      '<div class="face back"><button type="button" class="close" aria-label="Refermer la case">✕</button><span class="ico" aria-hidden="true">'+esc(ev.ico||"🌱")+'</span><h2>'+esc(ev.title)+'</h2>'+
        '<p class="when">'+esc(ev.when)+'</p><p>'+esc(ev.text)+'</p>'+(links?'<div class="links">'+links+'</div>':"")+
        '</div></div>';
    li.querySelector(".front").addEventListener("click",()=>{
      if(!isUnlocked(s)){li.classList.remove("shake");void li.offsetWidth;li.classList.add("shake");return}
      setOpen(li,s,true);updateCount();
    });
    li.querySelector(".close").addEventListener("click",()=>{setOpen(li,s,false);li.querySelector(".front").focus()});
    li.querySelector(".front").inert=isOpen;li.querySelector(".back").inert=!isOpen;
    if(isOpen)li.classList.add("open");
    grid.appendChild(li);
  });
  updateCount();
}
function updateCount(){
  const u=slots.filter(isUnlocked).length,n=slots.length;
  countEl.textContent=u===0?"Première case le "+fmtDate(first.opens)+" "+first.opens.getFullYear():(u+" case"+(u>1?"s":"")+" disponible"+(u>1?"s":"")+" sur "+n);
}
previewEl.addEventListener("change",render);
render();
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const box=document.getElementById("confetti"),cols=["#00305A","#7BAA17","#F8B000","#D6262B"];
  for(let i=0;i<28;i++){
    const e=document.createElement("span");
    e.style.left=Math.random()*100+"%";
    e.style.background=cols[i%cols.length];
    e.style.animationDuration=(4+Math.random()*5)+"s";
    e.style.animationDelay=(-Math.random()*9)+"s";
    e.style.transform="rotate("+Math.floor(Math.random()*360)+"deg)";
    box.appendChild(e);
  }
})();
</script>
</body>
</html>
